# EXAMPLE CASE (fictional). Chart specs and the pages built around them.

charts:
  cancer:
    type: oncology            # oncology | hospital | visits (see docs/case-file.md)
    id: cancer
    aria: "Cancer treatment timeline; the tables below list the same data."
    ranges:                   # named time windows: [from, to]
      all: [2015-01-01, 2026-12-31]
      met: [2020-10-01, 2026-12-31]
    defaultRange: met
    lanes:                    # top to bottom; h = height in px
      - {id: sys, label: "Systemic therapy", h: 58, labels: above, barH: 14}
      - {id: ae, label: "Serious side effects", h: 40, markerTop: 12}
      - {id: bone, label: "Bone agent", h: 34}
      - {id: rt, label: "Radiation", h: 34}
      - {id: hosp, label: "Procedures and\nhospital", h: 50}
      - {id: img, label: "Imaging", h: 40}
    cls:                      # bar classes -> color tokens from reports/templates/base.css
      endo: --series-1
      chemo: --series-2
      adc: --series-3
      bone: --series-4
      rt: --series-5
    bar_groups:               # therapy group -> lane
      - {group: systemic, lane: sys}
      - {group: bone, lane: bone}
      - {group: radiation, lane: rt}
    ae_lane: ae
    events_lane: hosp
    imaging_lane: img
    guide_kinds: [surgery]    # event kinds drawn as dashed vertical guides
    legend:                   # [sw, color token, label] or [shape, symbol, label]
      - [sw, --series-1, "Endocrine / targeted"]
      - [sw, --series-2, "Chemotherapy"]
      - [sw, --series-3, "Antibody–drug conjugate"]
      - [sw, --series-4, "Bone agent"]
      - [sw, --series-5, "Radiation"]
      - [held, "", ""]           # dashed outline: treatment held
      - [txt, "▲", "progression"]
      - [txt, "▼", "response"]

  # A hospital chart: procedures, ED visits and stays from the events, with the cancer therapy for context.
  hospital:
    type: hospital
    id: hosp
    aria: "Procedures, emergency visits and hospital stays; the tables below list the same data."
    labelWidth: 150
    ranges: {all: [2015-01-01, 2026-12-31], recent: [2020-10-01, 2026-12-31]}
    defaultRange: recent
    lanes:
      - {id: ops, label: "Surgery and\nprocedures", h: 46}
      - {id: ed, label: ED visits, h: 40}
      - {id: stay, label: Hospital stays, h: 34}
      - {id: rt, label: Radiation, h: 34}
      - {id: ctx, label: "Cancer therapy\n(context)", h: 40, labels: above, barH: 10}
    cls: {stay: --series-1, rt: --series-5, ctx: --text-muted}
    lane_of_kind: {surgery: ops, proc: ops, reduction: ops, ed: ed, hosp: stay}
    stay_lane: stay
    bar_groups:
      - {group: radiation, lane: rt}
      - {group: systemic, lane: ctx, cls: ctx, faint: true}
    guide_kinds: [surgery]
    legend:
      - [sw, --series-1, "Hospital stay"]
      - [sw, --series-5, "Radiation"]
      - [sw, --text-muted, "Cancer therapy (context)"]
      - [txt, "◆", "surgery"]
      - [txt, "●", "procedure"]
      - [txt, "○", "ED visit"]

pages:                        # interactive HTML pages
  cancer:
    chart: cancer
    file: cancer_timeline.html
    title: "Cancer treatment timeline (example)"
    sub: "Fictional example patient. Hover a bar or marker for details."
    ranges_ui: [[all, "2015 – present"], [met, "Metastatic 2021 – present"]]
    tables:
      - {title: Treatments, kind: therapies}
      - {title: Serious side effects, kind: adverse_events}
      - {title: "Procedures, ED and hospital", kind: events}
      - {title: Imaging milestones, kind: imaging}

  hospital:
    chart: hospital
    file: hospital_timeline.html
    title: "Procedures and hospital timeline (example)"
    sub: "Fictional example patient. Hover a marker for details."
    ranges_ui: [[recent, "2021 – present"], [all, "2015 – present"]]
    tables:
      - {title: "Procedures, ED and hospital", kind: stays}

document:                     # the full timeline: document.html with the charts inserted
  file: document.html
  output: treatment_timeline
  figures:
    FIG_CANCER: {chart: cancer, range: all}
    FIG_HOSP: {chart: hospital}

chart_pdfs:                   # a printable PDF of a page's chart, every marker numbered, with its tables
  - chart: cancer
    range: met
    name: cancer_timeline
    title: "Cancer treatment timeline (example)"
    fig_title: "Metastatic course, 2021 – present"
    sub: "Fictional example patient."
    how: "Bars are treatments; numbered markers are keyed below the chart."
    bars_title: Treatments
    tables: cancer
