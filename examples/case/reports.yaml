questions:     # each item: [topic, what the records show, question for the care team]
  disagree:
    - ["Tumor size at surgery", "The pathology report says 2.1 cm; a later visit note says 2.4 cm.", "Which is correct?"]
  gaps:
    - ["Germline testing", "No germline genetic test result is in the records.", "Was germline testing done, and where is the report?"]
    - ["Echocardiogram", "Doxorubicin was given in 2015; no echocardiogram report is in the records.", "Was a baseline echo done?"]
  settled:
    - ["PIK3CA test", "Liquid biopsy 5/2023 found PIK3CA H1047R (confirmed by the oncologist)."]
  settled_title: "C. Already settled"

emergency:
  fill_pdf:      # [label, value]; an empty value leaves a line to fill in by hand
    - ["Name", ""]
    - ["Date of birth", ""]
    - ["Emergency contact", ""]
    - ["Blood type", "O positive"]
    - ["Allergies", "Sulfa (rash)"]
    - ["Code status", ""]
