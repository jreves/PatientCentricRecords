    - ["On denosumab", "Monthly; avoid unplanned dental surgery."]
  extra_labs:       # rows added after any blood counts found in the notes: [test, value, date]
    - ["CA 27-29", "47 U/mL", "9/15/2026"]
  past: "Lumpectomy, chemotherapy and radiation (2015); tamoxifen then letrozole; bone recurrence 2021; then letrozole + palbociclib, fulvestrant + alpelisib, capecitabine."
