[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patientcentricrecords"
version = "0.9.0"
description = "De-identify a patient's medical records locally (Ollama), then build treatment reports from the de-identified notes with hosted Claude."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11",     # PDF text (brings pypdfium2 for page rendering)
  "openpyxl>=3.1",        # .xlsx sources
  "PyYAML>=6",            # report case files
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "Pillow>=10"]   # scanned PDFs; also needs the Tesseract program
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pipeline", "reports"]

[tool.setuptools.package-data]
reports = ["templates/*.css", "*.js", "package.json"]
pipeline = ["folders/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
